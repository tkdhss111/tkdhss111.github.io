# =============================================================================
# .github/workflows/publish.yml
#
# main ブランチへ push するたびに GitHub Actions が Quarto でサイトをビルドし、
# 結果を gh-pages ブランチへ公開する。
# 初回のみ、GitHub の Settings > Pages で Source を gh-pages に設定すること。
# =============================================================================

on:
  workflow_dispatch:      # 画面から手動実行もできるようにする
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # gh-pages へ push するために必要
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # R チャンクを含むページをビルドするために R と renv を用意する。
      # （現状 R チャンクが無くても、後で追加したときに動くようにしておく）
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
